name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: "test - ${{ matrix.os }} - py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # D-1 A：Python 3.8 已于 2024-10-07 EOL，统一到 3.12。
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: code
    env:
      # M6 GUI 离屏纪律：无显示器的 runner 上构造 Qt 窗口（不进事件循环）
      QT_QPA_PLATFORM: offscreen
      # 收集数对账（防"双绿但悄悄少跑"）：所有 test job 必须一致。
      EXPECTED_COLLECTED: "368"
    steps:
      - uses: actions/checkout@v7
        with:
          # M7 脱敏审计的历史扫描依赖完整 git 历史；默认浅克隆会让它静默退化为空跑。
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt system libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install package with dev+gui extras (两平台同口径)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,docx,viz,gui]"
      - name: Assert collected test count
        shell: bash
        run: |
          count=$(python -m pytest tests --collect-only -q 2>&1 | tail -1 | sed -n 's/^\([0-9]\+\) tests collected.*/\1/p')
          echo "collected=${count:-<none>} expected=${EXPECTED_COLLECTED}"
          test "$count" = "$EXPECTED_COLLECTED"
      - name: Run tests
        run: python -m pytest tests -v
      - name: Desensitize audit self-test (阳性/阴性对照, 不读仓库)
        run: python tools/desensitize_audit.py --selftest
      - name: Desensitize audit (发布门：跟踪树 + 全历史 + 提交元数据 零硬门命中)
        run: python tools/desensitize_audit.py --mode all
      - name: CLI smoke
        run: |
          taw --version
          taw selfcheck
          taw demo
          taw parse ../data/frozen/refs/refs_clean.bib
          taw parse ../data/frozen/thesis/thesis_synthetic.docx
          taw audit bench
          taw audit refs ../data/frozen/audit/refs_table.txt --body ../data/frozen/audit/body.txt --topology ../reports/topo.html
          taw audit thesis ../data/frozen/thesis/thesis_synthetic.docx --report ../reports/full.json
          taw audit thesis ../data/frozen/thesis/thesis_synthetic.docx --profile school-demo --review-topology ../reports/rev.html
          taw audit bench --line full
          taw audit bench --line all --report ../reports/bench_all.json
      - name: GUI smoke (offscreen; 两平台均装 gui extras)
        run: taw gui --check

  package:
    name: "package - windows - py3.12 (PyInstaller onedir + 红线 + 中立目录扩展清单)"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: code
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package with pkg extras (gui+com 与发布构建一致)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,docx,viz,gui,com,pkg]"
      - name: Build onedir dual-exe (taw.exe + taw-gui.exe)
        run: python -m PyInstaller tools/taw.spec --noconfirm --clean --distpath ../dist --workpath ../build
      - name: Build redline (禁区成分 + 重依赖目录 + 内嵌数据逐文件对账)
        run: python tools/check_build_redline.py ../dist/taw
      - name: Assert bundled GUI runtime
        run: python -c "from pathlib import Path; p=Path('../dist/taw/_internal/PySide6'); assert p.is_dir(), p"
      - name: GUI check on frozen exe
        run: ../dist/taw/taw.exe gui --check
      - name: Desensitize audit on dist tree (产物本体：个人标记 + 禁区成分 零命中)
        run: python tools/desensitize_audit.py --mode dist
      - name: Neutral-dir clean verification (仓库树外 + 剥离 PATH, 逐条取真实退出码)
        run: python tools/verify_neutral_dir.py ../dist --data-src ../data
