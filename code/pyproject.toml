[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-audit-workbench"
version = "0.1.1"
description = "毕业论文全流程审计工作台：文献审计线 + 全文审计线（GB/T 7714 双标尺、引用对账、AI 幻觉画像、交叉引用重排、学校格式核查、AIGC 痕迹自检）"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "yuluo554" }]
keywords = ["thesis", "academic-writing", "reference-audit", "GB/T 7714", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Text Processing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yuluo554/thesis-audit-workbench"
Repository = "https://github.com/yuluo554/thesis-audit-workbench"
Issues = "https://github.com/yuluo554/thesis-audit-workbench/issues"

[project.optional-dependencies]
# 依赖分层纪律（plan/03 §四）：extras 必须覆盖运行期与测试期真实 import。
dev = ["pytest>=7.0", "pyyaml>=5.4"]
docx = ["python-docx>=0.8.11"]
viz = ["pyvis>=0.3.2"]
gui = ["PySide6>=6.12,<7"]
com = ["pywin32>=305; sys_platform == 'win32'"]
pkg = ["pyinstaller>=6.22,<7"]

[project.scripts]
taw = "taw.cli:main"
taw-gui = "taw.gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
