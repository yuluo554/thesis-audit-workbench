[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-audit-workbench"
version = "0.1.0"
description = "毕业论文全流程审计工作台：文献审计线 + 全文审计线（GB/T 7714 双标尺、引用对账、AI 幻觉画像、交叉引用重排、学校格式核查、AIGC 痕迹自检）"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "yuluo554" }]
dependencies = []

[project.optional-dependencies]
# 依赖分层纪律（plan/03 §四）：extras 必须覆盖运行期与测试期真实 import；
# py3.8 上的重依赖写上限（PyInstaller 6.x 在 3.8 有 modulegraph 随机崩实录）。
dev = ["pytest>=7.0", "pyyaml>=5.4"]
docx = ["python-docx>=0.8.11"]
viz = ["pyvis>=0.3.2"]
gui = ["PySide6>=6.6"]
com = ["pywin32>=305; sys_platform == 'win32'"]
pkg = [
    "pyinstaller>=5.13,<6; python_version < '3.9'",
    "pyinstaller>=6.0; python_version >= '3.9'",
]

[project.scripts]
taw = "taw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
